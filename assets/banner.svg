<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">JOSH — Full Stack Developer</title>
  <desc id="banner-desc">A terminal session: whoami prints JOSH, Full Stack Developer, then a deploy from idea to production checks off the interface, API, mobile, data and cloud layers and goes live.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F0F6FC" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

      /* One 12 s loop: type whoami, print the name, type the deploy, tick each layer, go live, hold, clear.
         Resting state is the finished screen, so with animations off nothing is hidden. */
      .cover { transform-box: fill-box; transform-origin: 100% 50%; transform: scaleX(0); }
      .t1 { animation: t1 12s steps(6, end) infinite; }
      .t2 { animation: t2 12s steps(34, end) infinite; }
      .a1 { animation: a1 12s linear infinite; } .a2 { animation: a2 12s linear infinite; }
      .a3 { animation: a3 12s linear infinite; } .a4 { animation: a4 12s linear infinite; }
      .a5 { animation: a5 12s linear infinite; } .a6 { animation: a6 12s linear infinite; }
      .a7 { animation: a7 12s linear infinite; } .a8 { animation: a8 12s linear infinite; }
      .a9 { animation: a9 12s linear infinite; } .a10 { animation: a10 12s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }

      @keyframes t1 { 0%, 2.5% { transform: scaleX(1); } 9.17%, 95% { transform: scaleX(0); } 98%, 100% { transform: scaleX(1); } }
      @keyframes t2 { 0%, 21.67% { transform: scaleX(1); } 33.33%, 95% { transform: scaleX(0); } 98%, 100% { transform: scaleX(1); } }
      @keyframes a1 { 0%, 11.67% { opacity: 0; } 12.5%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 14.17% { opacity: 0; } 15%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 16.67% { opacity: 0; } 17.5%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a4 { 0%, 19.17% { opacity: 0; } 20%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a5 { 0%, 37.5% { opacity: 0; } 38.33%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a6 { 0%, 41.67% { opacity: 0; } 42.5%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a7 { 0%, 45.83% { opacity: 0; } 46.67%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a8 { 0%, 50% { opacity: 0; } 50.83%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a9 { 0%, 54.17% { opacity: 0; } 55%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes a10 { 0%, 59.17% { opacity: 0; } 60%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .t1, .t2, .a1, .a2, .a3, .a4, .a5, .a6, .a7, .a8, .a9, .a10, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#0D1117"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- Window -->
  <rect x="48" y="28" width="1184" height="304" rx="14" fill="#161B22" stroke="#30363D"/>
  <line x1="48" y1="66" x2="1232" y2="66" stroke="#30363D"/>
  <g fill="#30363D">
    <circle cx="76" cy="47" r="6"/>
    <circle cx="96" cy="47" r="6"/>
    <circle cx="116" cy="47" r="6" fill="#2563EB"/>
  </g>
  <text x="640" y="52" text-anchor="middle" class="mono" font-size="14" fill="#8B949E">josh@fiwb: ~</text>
  <line x1="648" y1="94" x2="648" y2="306" stroke="#30363D"/>

  <!-- whoami -->
  <g class="mono" font-size="18">
    <text x="96" y="118" fill="#2563EB">$</text>
    <text x="118" y="118" fill="#F0F6FC">whoami</text>
  </g>
  <rect class="cover t1" x="116" y="100" width="64" height="26" fill="#161B22"/>
  <text class="sans a1" x="92" y="212" font-size="96" font-weight="800" letter-spacing="8" fill="#F0F6FC">JOSH</text>
  <text class="mono a2" x="96" y="252" font-size="18" letter-spacing="5" fill="#C9D1D9">FULL STACK DEVELOPER</text>
  <text class="sans a3" x="96" y="290" font-size="17" fill="#8B949E">Building full-stack products from interface to infrastructure.</text>

  <!-- deploy -->
  <g class="mono a4" font-size="17">
    <text x="680" y="118" fill="#2563EB">$</text>
    <text x="702" y="118" fill="#F0F6FC">deploy --from idea --to production</text>
  </g>
  <rect class="cover t2" x="700" y="100" width="324" height="26" fill="#161B22"/>
  <g class="mono" font-size="16">
    <g class="a5"><text x="700" y="160" fill="#3FB950">✓</text><text x="728" y="160" fill="#F0F6FC">interface</text><text x="858" y="160" fill="#8B949E">React · TypeScript</text></g>
    <g class="a6"><text x="700" y="190" fill="#3FB950">✓</text><text x="728" y="190" fill="#F0F6FC">api</text><text x="858" y="190" fill="#8B949E">FastAPI · ASP.NET Core</text></g>
    <g class="a7"><text x="700" y="220" fill="#3FB950">✓</text><text x="728" y="220" fill="#F0F6FC">mobile</text><text x="858" y="220" fill="#8B949E">.NET MAUI · Expo</text></g>
    <g class="a8"><text x="700" y="250" fill="#3FB950">✓</text><text x="728" y="250" fill="#F0F6FC">data</text><text x="858" y="250" fill="#8B949E">PostgreSQL · MongoDB</text></g>
    <g class="a9"><text x="700" y="280" fill="#3FB950">✓</text><text x="728" y="280" fill="#F0F6FC">cloud</text><text x="858" y="280" fill="#8B949E">AWS · Azure · CI/CD</text></g>
  </g>
  <text class="mono a10" x="700" y="312" font-size="16" fill="#2563EB">→ live in production<tspan class="cursor" fill="#F0F6FC"> ▍</tspan></text>
</svg>
